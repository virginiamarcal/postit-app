<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Post-it — Todos os agendamentos</title>
<link rel="stylesheet" href="shared.css" />
<style>
  html, body { width: 100%; height: 100%; overflow: hidden; background: #EFE7D6; }
  .wrap { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .titlebar {
    height: 42px;
    background: #D8C9A3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  .titlebar h1 { font-size: 13px; margin: 0; font-weight: 700; color: #4a4030; }
  .titlebar button {
    -webkit-app-region: no-drag;
    background: rgba(0,0,0,0.1);
    width: 24px; height: 24px;
    border-radius: 50%;
    font-size: 13px;
  }
  .board {
    position: relative;
    flex: 1;
    overflow: auto;
    background-image: radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  .empty-msg {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #8a7d5f;
    font-size: 14px;
    text-align: center;
  }
  /* Medidas vindas do papel escolhido (renderer/skin.js), como no painel. */
  .note {
    position: absolute;
    width: 190px;
    height: var(--note-h, 250px);
    padding: var(--paper-top, 63px) var(--paper-right, 22px) var(--paper-bottom, 42px) var(--paper-left, 21px);
    filter: drop-shadow(2px 6px 8px rgba(0,0,0,0.3));
    cursor: grab;
    display: flex;
    flex-direction: column;
    font-size: 12px;
    user-select: none;
  }
  .note .slice {
    position: absolute;
    left: 0;
    width: 100%;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    z-index: -1;
  }
  .note .slice-head { top: 0; height: var(--head-h, 95px); background-image: var(--head-img); }
  .note .slice-mid  { top: var(--head-h, 95px); bottom: var(--foot-h, 40px); background-image: var(--mid-img); }
  .note .slice-foot { bottom: 0; height: var(--foot-h, 40px); background-image: var(--foot-img); }
  .note:active { cursor: grabbing; }
  .note.done { opacity: 0.55; }
  .note .meta {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.65;
    margin-bottom: 6px;
  }
  .note .text {
    flex: 1;
    word-break: break-word;
    white-space: pre-wrap;
    line-height: 1.35;
  }
  .note.done .text { text-decoration: line-through; }
  .note .actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 8px;
  }
  .note .actions button {
    background: rgba(0,0,0,0.12);
    border-radius: 6px;
    font-size: 11px;
    padding: 3px 7px;
  }
  .note .actions button:hover { background: rgba(0,0,0,0.22); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="titlebar">
      <h1>Todos os agendamentos</h1>
      <button id="closeBtn">✕</button>
    </div>
    <div class="board" id="board"></div>
  </div>
  <script src="skin.js"></script>
  <script src="board.js"></script>
</body>
</html>
