<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Post-it — Hoje</title>
<link rel="stylesheet" href="shared.css" />
<style>
  /* Fatias medidas na imagem original (1240x1268):
     papel  -> x 132..1099 | y 390..1210
     head   -> y 0..620  | mid -> y 700..760 | foot -> y 1010..1268
     escala = 420 / 1240 = 0.3387 */
  /* A janela é dimensionada por papel (skin.js/panelSizeFor); aqui só acompanha. */
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  .postit {
    position: relative;
    width: 100%;
    height: 100%;
    filter: drop-shadow(3px 8px 14px rgba(0,0,0,0.35));
  }
  /* As medidas vêm do papel escolhido (renderer/skin.js). */
  .bg { position: absolute; left: 0; width: 100%; background-repeat: no-repeat; background-size: 100% 100%; }
  .bg-head { top: 0; height: var(--head-h, 210px); background-image: var(--head-img); }
  .bg-mid  { top: var(--head-h, 210px); bottom: var(--foot-h, 87px); background-image: var(--mid-img); }
  .bg-foot { bottom: 0; height: var(--foot-h, 87px); background-image: var(--foot-img); }

  .drag-strip {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: var(--paper-top, 132px);
    -webkit-app-region: drag;
  }
  .topBtn {
    position: absolute;
    top: var(--paper-top, 138px);
    -webkit-app-region: no-drag;
    background: rgba(120,95,30,0.14);
    color: #6b5a25;
    width: 20px; height: 20px;
    border-radius: 50%;
    font-size: 11px;
    line-height: 1;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Alinhados pela borda do papel, não por pixel fixo: a margem do papel muda
     de uma arte para outra e valor fixo joga os botões para fora dele. */
  .closeBtn { right: var(--paper-right, 56px); }
  .pinBtn   { right: calc(var(--paper-right, 56px) + 24px); }
  .skinBtn  { right: calc(var(--paper-right, 56px) + 48px); }
  .topBtn:hover { background: rgba(120,95,30,0.28); }
  .pinBtn.on { background: #e6a817; color: #fff; }
  .pinBtn.on:hover { background: #d19a12; }

  /* Seletor de papel */
  .skinPicker {
    position: absolute;
    top: calc(var(--paper-top, 138px) + 26px);
    left: var(--paper-left, 45px);
    right: var(--paper-right, 48px);
    z-index: 7;
    background: rgba(255,255,255,0.94);
    border: 1px solid rgba(140,115,45,0.3);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    display: none;
  }
  .skinPicker.open { display: block; }
  .skinPicker .label {
    font-size: 10.5px;
    color: #8a7238;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .skinGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    max-height: 168px;
    overflow-y: auto;
  }
  .skinOpt {
    background: none;
    padding: 2px;
    border-radius: 8px;
    border: 2px solid transparent;
    line-height: 0;
  }
  .skinOpt img { width: 100%; border-radius: 6px; display: block; }
  .skinOpt:hover { border-color: rgba(230,168,23,0.5); }
  .skinOpt.sel { border-color: #e6a817; background: rgba(230,168,23,0.14); }

  /* Assinatura discreta: fica no rodapé do papel, do lado esquerdo — longe da
     dobrinha do canto. Quase invisível parada; o convite só aparece no hover. */
  .pawMark {
    position: absolute;
    left: var(--paper-left, 45px);
    bottom: calc(var(--paper-bottom, 72px) * 0.28);
    -webkit-app-region: no-drag;
    background: none;
    padding: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0.5;
    transition: opacity .18s ease;
    z-index: 6;
  }
  .pawMark:hover { opacity: 1; }
  .pawMark svg { width: 17px; height: 17px; display: block; }
  .pawMark svg path, .pawMark svg ellipse { fill: #6b5a25; }
  .pawMark .hint {
    font-size: 10px;
    color: #6b5a25;
    white-space: nowrap;
    max-width: 0;
    overflow: hidden;
    transition: max-width .22s ease;
  }
  .pawMark:hover .hint { max-width: 150px; }

  .content {
    position: absolute;
    left: var(--paper-left, 45px);
    right: var(--paper-right, 48px);
    top: var(--paper-top, 138px);
    bottom: var(--paper-bottom, 72px);
    display: flex;
    flex-direction: column;
  }
  .head-line {
    padding: 2px 4px 8px;
    border-bottom: 1px solid rgba(140,115,45,0.22);
    margin-bottom: 6px;
  }
  .head-line h1 { font-size: 15px; margin: 0; font-weight: 800; color: #5c4a1e; letter-spacing: .2px; }
  .head-line .date { font-size: 10.5px; color: #8a7238; margin-top: 1px; }

  .list {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .empty { text-align: center; color: #a08f5c; font-size: 12.5px; margin-top: 20px; }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    padding: 5px 6px;
    border-radius: 7px;
  }
  .task:hover { background: rgba(255,255,255,0.42); }
  .task.done { opacity: 0.45; }
  .task .check {
    width: 15px; height: 15px;
    border-radius: 50%;
    border: 2px solid #b3a068;
    margin-top: 2px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    color: white;
    background: transparent;
    cursor: pointer;
  }
  .task.done .check { background: #7cb342; border-color: #7cb342; }
  .task .body { flex: 1; min-width: 0; }
  .task .text { font-size: 12.5px; word-break: break-word; color: #4a3d16; line-height: 1.3; }
  .task.done .text { text-decoration: line-through; }
  .task .time { font-size: 10px; color: #97854e; margin-top: 1px; }
  .task .del { background: none; color: #bcac7c; font-size: 12px; padding: 0 2px; opacity: 0; }
  .task:hover .del { opacity: 1; }
  .task .del:hover { color: #d84343; }

  .composer { padding-top: 6px; border-top: 1px solid rgba(140,115,45,0.22); }
  .composer input[type=text] {
    width: 100%;
    border: 1px solid rgba(140,115,45,0.3);
    background: rgba(255,255,255,0.55);
    border-radius: 7px;
    padding: 5px 8px;
    font-size: 12.5px;
    color: #4a3d16;
    margin-bottom: 5px;
  }
  .composer input[type=text]::placeholder { color: #a89a6a; }
  .row { display: flex; gap: 5px; align-items: center; }
  .row input[type=date], .row input[type=time] {
    border: 1px solid rgba(140,115,45,0.3);
    background: rgba(255,255,255,0.55);
    border-radius: 7px;
    padding: 3px 5px;
    font-size: 11px;
    color: #4a3d16;
    flex: 1;
    min-width: 0;
  }
  .toggle {
    display: flex; align-items: center; gap: 3px;
    font-size: 10.5px; color: #6b5a25;
    user-select: none; white-space: nowrap;
  }
  .actions { display: flex; gap: 5px; margin-top: 5px; }
  .btn-add {
    flex: 1;
    background: #e6a817;
    color: #fff;
    border-radius: 7px;
    padding: 6px;
    font-size: 12px;
    font-weight: 700;
  }
  .btn-add:hover { background: #d19a12; }
  .btn-board {
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(140,115,45,0.3);
    border-radius: 7px;
    padding: 6px 9px;
    font-size: 11.5px;
    color: #6b5a25;
  }
  .btn-board:hover { background: rgba(255,255,255,0.85); }
</style>
</head>
<body>
  <div class="postit">
    <div class="bg bg-head"></div>
    <div class="bg bg-mid"></div>
    <div class="bg bg-foot"></div>
    <div class="drag-strip"></div>
    <button class="topBtn skinBtn" id="skinBtn" title="Trocar o papel">🐾</button>
    <button class="topBtn pinBtn" id="pinBtn" title="Fixar na tela">📌</button>
    <button class="topBtn closeBtn" id="closeBtn">✕</button>

    <div class="skinPicker" id="skinPicker">
      <div class="label">Escolha o papel</div>
      <div class="skinGrid" id="skinGrid"></div>
    </div>

    <div class="content">
      <div class="head-line">
        <h1>Hoje</h1>
        <div class="date" id="dateLabel"></div>
      </div>
      <div class="list" id="list"></div>
      <div class="composer">
        <input type="text" id="taskText" placeholder="Nova tarefa..." maxlength="200" />
        <div class="row">
          <input type="date" id="taskDate" />
          <label class="toggle"><input type="checkbox" id="hasTime" /> hora?</label>
          <input type="time" id="taskTime" style="display:none" />
        </div>
        <div class="actions">
          <button class="btn-add" id="addBtn">Adicionar</button>
          <button class="btn-board" id="boardBtn">Ver todos</button>
        </div>
      </div>
    </div>

    <button class="pawMark" id="pawMark" title="Feito por Virginia Lara Marçal — abrir o Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <ellipse cx="12" cy="16.5" rx="6" ry="5"/>
        <ellipse cx="5.6" cy="9.6" rx="2.3" ry="3"/>
        <ellipse cx="9.8" cy="6.4" rx="2.3" ry="3.2"/>
        <ellipse cx="14.2" cy="6.4" rx="2.3" ry="3.2"/>
        <ellipse cx="18.4" cy="9.6" rx="2.3" ry="3"/>
      </svg>
      <span class="hint">feito por @virginiamarcal</span>
    </button>
  </div>
  <script src="skin.js"></script>
  <script src="panel.js"></script>
</body>
</html>
