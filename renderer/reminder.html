<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Post-it — lembrete</title>
<link rel="stylesheet" href="shared.css" />
<style>
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  /* O gatinho entra pela lateral, como se espiasse por trás da borda da tela.
     A arte já vem com o lado direito reto justamente para encostar ali. */
  .gato {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: right center;
    filter: drop-shadow(-6px 6px 16px rgba(0,0,0,0.35));
    transform: translateX(105%);
    opacity: 0;
    transition: transform .55s cubic-bezier(.22,1,.36,1), opacity .3s ease;
    cursor: pointer;
    -webkit-user-drag: none;
  }
  .gato.entrou { transform: translateX(0); opacity: 1; }
  .gato.saindo { transform: translateX(105%); opacity: 0; }
</style>
</head>
<body>
  <img class="gato" id="gato" alt="" />
  <script src="reminder.js"></script>
</body>
</html>
